services:

  ms-usuarios:
    build: ./ms-usuarios
    ports:
      - "8080:8080"
    environment:
      DB_URL: jdbc:postgresql://users-db:5432/${USERS_DB_NAME}
      DB_USERNAME: ${USERS_DB_USER}
      DB_PASSWORD: ${USERS_DB_PASSWORD}

    depends_on:
      - users-db
    networks:
      - users-network

  # Banco de dados do MS1 - Usuários
  users-db:
    image: postgres:17
    restart: unless-stopped

    environment:
      POSTGRES_DB: ${USERS_DB_NAME}
      POSTGRES_USER: ${USERS_DB_USER}
      POSTGRES_PASSWORD: ${USERS_DB_PASSWORD}

    ports:
      - "127.0.0.1:5433:5432"

    volumes:
      - users_data:/var/lib/postgresql/data

    networks:
      - users-network


  ms-transacoes:
    build: ./ms-transacoes
    ports:
      - "8081:8081"
    environment:
      DB_URL: jdbc:postgresql://transactions-db:5432/${TRANSACTIONS_DB_NAME}
      DB_USERNAME: ${TRANSACTIONS_DB_USER}
      DB_PASSWORD: ${TRANSACTIONS_DB_PASSWORD}
      USERS_SERVICE_URL: http://ms-usuarios:8080
      ACCOUNTS_SERVICE_URL: ${ACCOUNTS_SERVICE_URL}
    depends_on:
      - transactions-db
    networks:
      - transactions-network
      - users-network

  # Banco de dados do MS2 - Transações
  transactions-db:
    image: postgres:17
    restart: unless-stopped

    environment:
      POSTGRES_DB: ${TRANSACTIONS_DB_NAME}
      POSTGRES_USER: ${TRANSACTIONS_DB_USER}
      POSTGRES_PASSWORD: ${TRANSACTIONS_DB_PASSWORD}


    ports:
      - "127.0.0.1:5434:5432"

    volumes:
      - transactions_data:/var/lib/postgresql/data

    networks:
      - transactions-network

volumes:
  users_data:
  transactions_data:

networks:
  users-network:
    driver: bridge

  transactions-network:
    driver: bridge